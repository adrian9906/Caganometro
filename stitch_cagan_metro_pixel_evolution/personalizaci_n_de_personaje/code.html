<style>
        .pixel-border {
            box-shadow: 4px 4px 0 0 #1b1c1c;
            border: 4px solid #1b1c1c;
        }
        .pixel-border-sm {
            box-shadow: 2px 2px 0 0 #1b1c1c;
            border: 2px solid #1b1c1c;
        }
        .pixel-input {
            border: 4px solid #1b1c1c;
            box-shadow: inset 4px 4px 0 0 rgba(27,28,28,0.1);
        }
        .pixel-btn {
            box-shadow: 0 8px 0 0 #1b1c1c;
            border: 4px solid #1b1c1c;
            transition: all 0.1s;
        }
        .pixel-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 0 #1b1c1c;
        }
        .grid-pattern {
            background-image: 
                linear-gradient(rgba(139, 69, 19, 0.1) 2px, transparent 2px),
                linear-gradient(90deg, rgba(139, 69, 19, 0.1) 2px, transparent 2px);
            background-size: 20px 20px;

<body class="bg-background min-h-screen flex flex-col items-center py-margin-desktop px-margin-mobile">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-container-highest border-b-4 border-on-surface dark:border-on-background shadow-[0_4px_0_0_rgba(27,28,28,1)] flex justify-between items-center px-margin-mobile h-20 transition-all">
<div class="flex items-center gap-4">
<img alt="Caganómetro Logo" class="h-12 w-12 pixel-border-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDrixOPFYFDccHr197wn1GbFG2jvoOaHz1I2SLguBgUvyfitLqbyv95nJO0EqubVQcdTYzLQVBUT-V3RxemuoeDxt8LurbHznstDHL5AjR4DZkTfcxw1iAnJ37XVBQnPMdg9s2pUYkCR4org60Xknufd9Zi2Rslap2DZbkpDEtW_EJmo5PKK92BZTYyuhna_u38_jpwQqe0VU05tM7vYQNBZTU9LJNKlq-IFvlkYCjy0a_8amiwG61fT2lT2Lq0KVS4VYeiOx_7nH0c">
<h1 class="font-headline-lg text-headline-lg text-primary dark:text-primary-fixed uppercase tracking-tighter">CAGANÓMETRO</h1>
</div>
<div class="hidden md:flex gap-6">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed text-3xl hover:bg-surface-container-high transition-all p-2 rounded-lg cursor-pointer">leaderboard</span>
<span class="material-symbols-outlined text-primary dark:text-primary-fixed text-3xl hover:bg-surface-container-high transition-all p-2 rounded-lg cursor-pointer">person</span>
<span class="material-symbols-outlined text-primary dark:text-primary-fixed text-3xl hover:bg-surface-container-high transition-all p-2 rounded-lg cursor-pointer">settings</span>
</div>
</header>
<main class="w-full max-w-container-max mt-32 flex flex-col gap-12">
<div class="text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">CREA TU CAGADOR</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Configura tu avatar para iniciar la aventura.</p>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
<!-- Character Preview -->
<div class="bg-surface-container-low pixel-border p-6 flex flex-col items-center justify-center relative min-h-[400px] grid-pattern">
<div class="absolute top-4 left-4 bg-primary-container text-on-primary-container px-3 py-1 font-label-caps text-label-caps border-2 border-on-surface">PREVIEW</div>
<!-- Placeholder for Pixel Art Silhouette -->
<div class="w-48 h-48 bg-surface-variant border-4 border-on-surface flex items-center justify-center relative overflow-hidden"><img src="https://lh3.googleusercontent.com/aida/AP1WRLu8k8vHYSmfe05QpLq_XBCfGfNRbNRbYb9TzRZnlFtw1aRZ6sYbfJSZ1QVfHwTCcplmKHzNWpLNctdW7C0U926x6i5BYqVTEmc4ci7yd9BAN97-D4BUjipuTnTRRhN8Zh6_3YtVD5WIhC363fnDG3ZaYrAAN9UUSKkEeNQv60vmAGlRrVYkPSmF68MN2GEBNvTpQhZCU-B0hJYiA_ARFdQ1nHLPBosFPceT4wGucC3R90gY8wSYJX4ouds" alt="Character Preview" class="w-full h-full object-contain pixelated" style="image-rendering: pixelated;"></div>
</div>
<!-- Configuration Form -->
<div class="bg-surface pixel-border p-8 flex flex-col gap-6">
<div class="flex flex-col gap-2">
<label class="font-headline-md text-headline-md text-on-surface">Nombre</label>
<input class="pixel-input bg-surface-container-lowest p-3 font-body-lg text-body-lg focus:outline-none focus:border-primary" placeholder="Ej. El Destructor" type="text">
</div>
<div class="flex flex-col gap-2">
<label class="font-headline-md text-headline-md text-on-surface">Edad</label>
<input class="pixel-input bg-surface-container-lowest p-3 font-body-lg text-body-lg focus:outline-none focus:border-primary" max="120" min="1" placeholder="18" type="number">
</div>
<div class="flex flex-col gap-2">
<label class="font-headline-md text-headline-md text-on-surface flex justify-between">
<span class="">Estatura</span>
<span class="text-primary" id="stature-val">1.6m</span>
</label>
<input class="w-full h-4 bg-surface-variant rounded-lg appearance-none cursor-pointer accent-primary" id="stature-slider" max="2.2" min="1.0" step="0.1" type="range" value="1.6">
</div>
<div class="flex flex-col gap-2">
<label class="font-headline-md text-headline-md text-on-surface">Color de Pelo</label>
<select class="pixel-input bg-surface-container-lowest p-3 font-body-lg text-body-lg focus:outline-none focus:border-primary cursor-pointer">
<option value="black">Negro Azabache</option>
<option value="blonde">Rubio Radiante</option>
<option value="red">Rojo Fuego</option>
</select>
</div>
<div class="flex flex-col gap-2">
<label class="font-headline-md text-headline-md text-on-surface">Color de Piel</label>
<div class="flex gap-4">
<button class="w-12 h-12 bg-[#fbd4b4] pixel-border-sm hover:scale-105 transition-transform skin-color-btn" data-color="#fbd4b4"></button>
<button class="w-12 h-12 bg-[#d2a172] pixel-border-sm hover:scale-105 transition-transform skin-color-btn" data-color="#d2a172"></button>
<button class="w-12 h-12 bg-[#8d5524] pixel-border-sm hover:scale-105 transition-transform skin-color-btn" data-color="#8d5524"></button>
<button class="w-12 h-12 bg-[#3e2312] pixel-border-sm hover:scale-105 transition-transform skin-color-btn" data-color="#3e2312"></button>
</div>
</div>
</div>
</div>
<div class="flex justify-center mt-8 pb-32 md:pb-0">
<button class="pixel-btn bg-primary-container text-on-primary-container font-headline-lg text-headline-lg py-4 px-12 hover:bg-surface-tint active:bg-primary-fixed">
                EMPEZAR AVENTURA
            </button>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-4 h-24 bg-surface dark:bg-surface-container-highest border-t-4 border-on-surface dark:border-on-background shadow-[0_-4px_0_0_rgba(27,28,28,1)] md:hidden">
<div class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 cursor-pointer">
<span class="material-symbols-outlined text-3xl mb-1">videogame_asset</span>
<span class="font-label-caps text-label-caps">Jugar</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 cursor-pointer">
<span class="material-symbols-outlined text-3xl mb-1">military_tech</span>
<span class="font-label-caps text-label-caps">Ranking</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container border-2 border-on-surface shadow-[4px_4px_0_0_rgba(27,28,28,1)] px-4 py-1 cursor-pointer">
<span class="material-symbols-outlined text-3xl mb-1">account_circle</span>
<span class="font-label-caps text-label-caps">Perfil</span>
</div>
</nav>
<script>
        // Micro-interactions
        const statureSlider = document.getElementById('stature-slider');
        const statureVal = document.getElementById('stature-val');
        
        statureSlider.addEventListener('input', (e) => {
            statureVal.textContent = `${e.target.value}m`;
        });

        const skinButtons = document.querySelectorAll('.skin-color-btn');
        const silhouette = document.getElementById('character-silhouette');

        skinButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const color = e.target.getAttribute('data-color');
                silhouette.style.backgroundColor = color;
                
                // Active state styling
                skinButtons.forEach(b => b.classList.remove('border-primary'));
                e.target.classList.add('border-primary');
            });
        });
    </script>


</body></html>
