<style>
        /* Pixel Art Border Utilities */
        .pixel-border {
            border: 4px solid #2F2F2F;
        }
        
        .pixel-shadow {
            box-shadow: 4px 4px 0px 0px #2F2F2F;
        }

        .pixel-shadow-lg {
            box-shadow: 8px 8px 0px 0px #2F2F2F;
        }

        .pixel-btn {
            border: 4px solid #2F2F2F;
            box-shadow: 0px 8px 0px 0px #2F2F2F;
            transition: all 0.1s ease;
        }

        .pixel-btn:active {
            transform: translateY(8px);
            box-shadow: 0px 0px 0px 0px #2F2F2F;
        }

        .pixel-panel {
            border: 8px solid #2F2F2F;
            background-color: #8b4513;
            box-shadow: 8px 8px 0px 0px #2F2F2F;
            position: relative;
        }
        
        .pixel-panel::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 4px solid #ffb68c;
            pointer-events: none;
        }

        /* Grid Background Pattern */
        .bg-grid-mint {
            background-image: 
                linear-gradient(#9dd3b1 2px, transparent 2px),
                linear-gradient(90deg, #9dd3b1 2px, transparent 2px);
            background-size: 20px 20px;
            background-color: #b5ecc9;
        }

        /* Progress Bar Pips */
        .pip {
            width: 8px;
            height: 100%;
            background-color: #8b4513;
            margin-right: 2px;
            display: inline-block;
        }
        .pip.empty {
            background-color: transparent;
        }

        /* Character Animations */
        @keyframes slideToToilet {
            0% { transform: translateX(0) scale(var(--char-scale, 1)); }
            40% { transform: translateX(120px) scale(var(--char-scale, 1)); }
            50% { transform: translateX(120px) scale(0.8) translateY(20px); opacity: 0; }
            60% { transform: translateX(120px) scale(0.8) translateY(20px); opacity: 0; }
            80% { transform: translateX(120px) scale(calc(var(--char-scale, 1) + 0.1)) translateY(0); opacity: 1; }
            100% { transform: translateX(0) scale(calc(var(--char-scale, 1) + 0.1)); }
        }

        .anim-poop {
            animation: slideToToilet 2s ease-in-out forwards;
        }

        /* POOP Text Animation */
        @keyframes poopPop {
            0% { opacity: 0; transform: scale(0) translateY(0); }
            50% { opacity: 1; transform: scale(1.5) translateY(-40px); }
            100% { opacity: 0; transform: scale(1) translateY(-80px); }
        }

        .poop-text {
            position: absolute;
            opacity: 0;
            color: #6c2f00;
            font-family: 'Space Mono', monospace;
            font-weight: 900;
            font-size: 32px;
            text-shadow: 2px 2px 0px #ffdbc9, -2px -2px 0px #ffdbc9, 2px -2px 0px #ffdbc9, -2px 2px 0px #ffdbc9;
            z-index: 50;
        }
        
        .poop-text.active {
            animation: poopPop 1s ease-out forwards;
        }
        
        .pixelated-img {
            image-rendering: pixelated;
        }
    </style>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('poopButton');
            const character = document.getElementById('character');
            const poopText = document.getElementById('poopText');
            const cacasCounter = document.getElementById('cacasCounter');
            const sizeCounter = document.getElementById('sizeCounter');
            
            let totalCacas = 0;
            let currentScale = 1;
            let isAnimating = false;

            btn.addEventListener('click', () => {
                if (isAnimating) return;
                isAnimating = true;

                // Disable button
                btn.style.opacity = '0.5';
                btn.style.pointerEvents = 'none';

                // Trigger character animation
                character.classList.remove('anim-poop');
                void character.offsetWidth; // trigger reflow
                character.classList.add('anim-poop');

                // Trigger POOP text at middle of animation (when char disappears)
                setTimeout(() => {
                    poopText.classList.remove('active');
                    void poopText.offsetWidth;
                    poopText.classList.add('active');
                    
                    // Update stats
                    totalCacas++;
                    cacasCounter.textContent = totalCacas;
                    
                    if (totalCacas % 5 === 0) {
                        currentScale += 0.1;
                        character.style.setProperty('--char-scale', currentScale);
                        sizeCounter.textContent = `Nvl. ${Math.floor(totalCacas/5) + 1}`;
                        
                        // Slightly darken skin tone by adding a sepia/brightness filter combo
                        // This is a simple visual trick without needing separate image assets
                        let darkenAmount = (totalCacas / 50); // max 50 cacas for full effect
                        if(darkenAmount > 0.8) darkenAmount = 0.8;
                        character.querySelector('img').style.filter = `sepia(${darkenAmount * 100}%) brightness(${100 - (darkenAmount * 30)}%)`;
                    }
                }, 1000); // halfway through 2s animation

                // Reset after animation
                setTimeout(() => {
                    isAnimating = false;
                    btn.style.opacity = '1';
                    btn.style.pointerEvents = 'auto';
                    character.classList.remove('anim-poop');
                    character.style.transform = `scale(${currentScale})`;
                }, 2000);
            });
        });
    </script>
